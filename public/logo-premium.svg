<svg width="280" height="80" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rdvexGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="rdvexGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Monograma R estilizado -->
  <g transform="translate(10, 15)">
    <polygon points="0,0 28,0 28,50 0,50" fill="url(#rdvexGrad2)" filter="url(#glow)"/>
    <polygon points="18,0 46,25 18,50" fill="#0b1220" opacity="0.9"/>
    <!-- Corte do R -->
    <rect x="14" y="15" width="8" height="20" fill="url(#rdvexGrad)"/>
  </g>
  
  <!-- Wordmark RDVEX -->
  <text x="65" y="45" font-family="Inter, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-1.5">
    <tspan fill="url(#rdvexGrad)">RD</tspan>
    <tspan fill="#e5e7eb">VEX</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="65" y="62" font-family="Inter, sans-serif" font-size="10" font-weight="500" letter-spacing="2" fill="#9ca3af">DIGITAL & TECH SOLUTIONS</text>
</svg>
